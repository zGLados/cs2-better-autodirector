name: Build Linux Package

on:
  push:
    tags:
      - 'v*.*.*'  # Build only on version tags like v0.2.2
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and upload assets
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: gui/go.sum
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev
      
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      
      - name: Build GUI Application
        run: |
          cd gui
          wails build -skipbindings
      
      - name: Create Package
        run: |
          chmod +x ./scripts/build-package.sh
          ./scripts/build-package.sh
      
      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2BetterAutoDirector-Linux
          path: build/CS2BetterAutoDirector-Linux-x64.tar.gz
          retention-days: 90
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/CS2BetterAutoDirector-Linux-x64.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
