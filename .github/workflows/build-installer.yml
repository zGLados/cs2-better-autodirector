name: Build Windows Installer

on:
  push:
    branches:
      - dev  # Build on every push to dev branch
    tags:
      - 'v*'  # Build on version tags like v3.1.0
  pull_request:
    branches:
      - dev  # Build on pull requests to dev
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write  # Required to create releases and upload assets
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        shell: powershell
      
      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: powershell
      
      - name: Build GUI Application
        run: |
          cd gui
          wails build -skipbindings
        shell: powershell
      
      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" .\scripts\installer.iss
        shell: powershell
      
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2BetterAutoDirector-Setup
          path: build/CS2BetterAutoDirector-Setup.exe
          retention-days: 90
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/CS2BetterAutoDirector-Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
