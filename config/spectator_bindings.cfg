// ====================================================================
// AUTO OBSERVER - SPECTATOR KEYBINDINGS with TOGGLE
// ====================================================================
// 
// This config provides a toggle between normal play and spectator mode
// to avoid overwriting your regular weapon bindings!
// 
// INSTALLATION:
// 1. Copy this file to:
//    Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/cfg/
//
// 2. In CS2, bind a key to toggle modes (example: F9):
//    bind "F9" "spec_mode_toggle"
//
// 3. Press F9 when entering/exiting spectator mode
// ====================================================================

echo "==============================================="
echo "  Auto Observer - Spectator Bindings Config  "
echo "==============================================="

// ====================================================================
// SPECTATOR MODE - Bindings for Auto Observer
// ====================================================================
alias "spec_mode_on" "bind 1 spec_player_by_index 0; bind 2 spec_player_by_index 1; bind 3 spec_player_by_index 2; bind 4 spec_player_by_index 3; bind 5 spec_player_by_index 4; bind 6 spec_player_by_index 5; bind 7 spec_player_by_index 6; bind 8 spec_player_by_index 7; bind 9 spec_player_by_index 8; bind 0 spec_player_by_index 9; alias spec_mode_toggle spec_mode_off; echo [SPECTATOR MODE ON] Keys 1-0 control player slots"

// ====================================================================
// NORMAL MODE - Standard weapon bindings
// ====================================================================
alias "spec_mode_off" "bind 1 slot1; bind 2 slot2; bind 3 slot3; bind 4 slot4; bind 5 slot5; bind 6 slot6; bind 7 slot7; bind 8 slot8; bind 9 slot9; bind 0 slot10; alias spec_mode_toggle spec_mode_on; echo [NORMAL MODE ON] Keys 1-0 control weapons"

// ====================================================================
// TOGGLE COMMAND - Switch between modes
// ====================================================================
// Default: Start in NORMAL mode (weapons)
alias "spec_mode_toggle" "spec_mode_on"

echo ""
echo "Toggle command created: spec_mode_toggle"
echo ""
echo "USAGE:"
echo "  1. Bind a key: bind F9 spec_mode_toggle"
echo "  2. Press F9 to enable spectator bindings"
echo "  3. Press F9 again to restore weapon bindings"
echo ""
echo "Current mode: NORMAL (weapons)"
echo "==============================================="
